<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zion Bonsai bookings (Grist widget)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<!-- A Grist custom widget: everyone booked on upcoming workshops, who owes money, and the payment buttons.
     Put it on the Registrations table. No column mapping. Only works inside Grist. -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --paper: #F4EEE6; --paper-deep: #E9DFD2; --sandstone: #D9AE93; --linen: #FBF8F3;
    --clay: #A84A2B; --clay-dark: #8F3E23; --moss: #4F6420; --forest: #2F3B22;
    --rule: rgba(47, 59, 34, .15); --edge: rgba(47, 59, 34, .4);
    --late-bg: rgba(168, 74, 43, .13); --soon-bg: rgba(217, 174, 147, .4);
    --radius: 3px;
    --sans: 'Open Sans', system-ui, sans-serif;
    --label: 'Montserrat', 'Open Sans', system-ui, sans-serif;
    --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--forest); font: 400 16px/1.5 var(--sans); }
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 80px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  h1 { font: 500 34px/1.1 var(--display); margin: 4px 0 4px; }
  h1 em { font-style: italic; }
  h2 { font: 600 11px/1.2 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--moss);
       margin: 28px 0 10px; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; }
  .label { font: 600 11px/1.2 var(--label); letter-spacing: .16em; text-transform: uppercase; }
  .hint { color: var(--moss); font-size: 14px; margin: 4px 0; }
  .empty { color: var(--moss); padding: 6px 2px 10px; }
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  .btn { font: 600 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; min-height: 44px; padding: 0 18px;
         border: 1px solid var(--clay); border-radius: var(--radius); background: var(--clay); color: var(--linen); cursor: pointer; }
  .btn:hover { background: var(--clay-dark); border-color: var(--clay-dark); }
  .btn.plain { background: var(--linen); color: var(--forest); border-color: var(--edge); }
  .btn.plain:hover { background: var(--paper-deep); }
  .btn:disabled { opacity: .55; cursor: default; }
  .link { background: none; border: 0; padding: 0; min-height: 44px; display: inline-flex; align-items: center;
          color: var(--clay); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15px; }
  .people { display: grid; gap: 10px; margin-top: 14px; }
  .people .btn { min-height: 56px; font-size: 13px; text-align: left; padding: 0 20px; }
  .next { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; margin: 10px 0 4px; }
  .next b { font-weight: 600; }
  .card { background: var(--linen); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .card.late { background: var(--late-bg); border-color: rgba(168, 74, 43, .35); }
  .card.soon { background: var(--soon-bg); border-color: rgba(217, 174, 147, .9); }
  .card.done { opacity: .6; }
  .card.pending { opacity: .6; }
  .card .title { font-weight: 600; overflow-wrap: anywhere; cursor: pointer; min-height: 44px; display: flex; align-items: center;
                 background: none; border: 0; padding: 0; text-align: left; width: 100%; }
  .card .meta { color: var(--forest); font-size: 14px; margin: 0 0 10px; opacity: .85; }
  .card.late .meta { opacity: 1; font-weight: 600; }
  .card .donebtn { width: 100%; min-height: 48px; }
  .card .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  details.fold { margin-top: 18px; }
  details.fold summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--clay);
                         font: 600 11px/1.2 var(--label); letter-spacing: .16em; text-transform: uppercase; }
  .addbtn { width: 100%; min-height: 48px; margin-bottom: 10px; }
  form.add { display: grid; gap: 10px; margin-bottom: 12px; background: var(--linen); border: 1px solid var(--rule);
             border-radius: var(--radius); padding: 14px; }
  label.f { display: grid; gap: 4px; }
  label.f .label { color: var(--moss); }
  input, select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: var(--radius);
                            background: var(--paper); color: var(--forest); }
  textarea { min-height: 96px; resize: vertical; }
  input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .bar { display: flex; gap: 10px; }
  .bar .btn { flex: 1; }
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--paper); overflow-y: auto; }
  #sheet .inner { max-width: 640px; margin: 0 auto; padding: 18px 14px 40px; display: grid; gap: 14px; }
  #sheet h1 { font-size: 28px; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--forest); color: var(--linen); z-index: 20;
           padding: 8px 8px 8px 16px; border-radius: var(--radius); opacity: 0; transition: opacity .2s; pointer-events: none;
           display: flex; gap: 10px; align-items: center; max-width: calc(100% - 24px); }
  #toast.show { opacity: 1; pointer-events: auto; }
  #toast button { background: none; border: 1px solid rgba(251, 248, 243, .5); color: var(--linen); border-radius: var(--radius);
                  font: 600 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; min-height: 44px; padding: 0 14px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  .summary { margin: 8px 0 0; }
  .summary b { font-weight: 600; }
  .toggles { display: grid; gap: 10px; }
  .toggle { width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center; text-align: left;
            padding: 0 16px; background: var(--linen); color: var(--forest); border: 1px solid var(--edge); border-radius: var(--radius);
            font: 600 12px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
  .toggle[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .toggle:disabled { opacity: .55; cursor: default; }
  .acts { display: grid; gap: 8px; margin-top: 10px; }
  .acts .btn { width: 100%; min-height: 48px; text-align: left; padding: 10px 16px; line-height: 1.3; }
  .note { color: var(--moss); font-size: 14px; margin: 6px 0 0; }
  .warn { margin: 0 0 10px; padding: 8px 10px; background: var(--late-bg); border: 1px solid rgba(168, 74, 43, .35);
          border-radius: var(--radius); font-size: 14px; font-weight: 600; }
  .chip { display: inline-block; font: 600 10px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px;
          border: 1px solid var(--edge); border-radius: var(--radius); background: var(--paper); }
  .chip.paid { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .chip.pending { background: var(--soon-bg); border-color: rgba(217, 174, 147, .9); }
  .card.out { opacity: .6; }
  .card .hereb { width: 100%; min-height: 52px; margin-top: 4px; }
  .card .hereb[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .pick { margin: 8px 0 0; }
  .results { display: grid; gap: 6px; }
  .results .btn { text-align: left; min-height: 44px; }
  .results .btn[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .contact { display: flex; flex-wrap: wrap; gap: 8px; }
  .contact a { flex: 1; min-width: 90px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .bar .btn[type=submit] { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .chipbtn { min-height: 44px; padding: 0 14px; background: var(--linen); color: var(--forest); border: 1px solid var(--edge); border-radius: var(--radius);
             font: 600 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  .chipbtn[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .chip.late { background: var(--late-bg); border-color: rgba(168, 74, 43, .35); }
  .chips-inline { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .card .contact { margin-top: 10px; }
  .card .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .card .stat .btn { min-height: 48px; padding: 0 8px; }
  .card .stat .btn[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .card .onsite { margin: 0 0 8px; }
  .card .acts-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
  .quote { margin: 0 0 10px; overflow-wrap: anywhere; }
  .top { font-weight: 600; }
  .chip.used { background: var(--paper-deep); }
  .paidline { font-weight: 600; }
  h2 .t { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="app"><p class="hint">This is a Grist custom widget. Open it inside Grist.</p></main>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Details"></div>
<div id="toast" role="status"></div>
<script>
const SAVE_MS = 10000, LOAD_MS = 20000;
const MSG_FAIL = "Couldn't load. Check your connection.";
const MSG_SAVE = "Couldn't save. Check your connection and try again.";
const MSG_ACCESS = "That can't be changed here. Ask Landon if you think it should be.";

let loaded = false, loadFailed = false, loadSeq = 0, sheet = null;
const busy = new Set();

const app = document.getElementById('app');
const sheetEl = document.getElementById('sheet');
const toast = document.getElementById('toast');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const withTimeout = (p, ms = SAVE_MS) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(new Error('timeout')), ms);
  Promise.resolve(p).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
});
const write = acts => withTimeout(grist.docApi.applyUserActions(acts));
function errMsg(e) {
  if (!navigator.onLine) return MSG_SAVE;
  return /access|permission|blocked|denied/i.test(String(e?.message ?? e)) ? MSG_ACCESS : MSG_SAVE;
}
function rowsOf(t) { return t.id.map((id, i) => Object.fromEntries(Object.keys(t).map(k => [k, t[k][i]]))); }

// ---- Grist's encoded cell values --------------------------------------------------------
function decode(v) {
  if (Array.isArray(v)) {
    if (v[0] === 'L') return v.slice(1).map(decode);
    if (v[0] === 'O' && v.length === 2 && v[1] && typeof v[1] === 'object') return Object.fromEntries(Object.entries(v[1]).map(([k, x]) => [k, decode(x)]));
    if (v[0] === 'E' || v[0] === 'P' || v[0] === 'C') return null;
    return v.map(decode);
  }
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, decode(x)]));
  return v;
}
function listOf(v) { const d = decode(v); return Array.isArray(d) ? d.map(String) : d ? [String(d)] : []; }
const refId = v => { const n = Number(Array.isArray(v) ? v[1] : v); return Number.isFinite(n) && n > 0 ? n : null; };

// ---- Dates: Grist Date cells are seconds at UTC midnight -------------------------------
function todayIso() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function isoDay(v) {
  if (v == null || v === '') return null;
  const secs = v instanceof Date ? v.getTime() / 1000 : Number(v);
  if (!Number.isFinite(secs) || secs <= 0) return null;
  if (secs % 86400 === 0) return new Date(secs * 1000).toISOString().slice(0, 10);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date(secs * 1000)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const toSecs = iso => iso ? Date.parse(iso + 'T00:00:00Z') / 1000 : null;
const dayDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const fmt = (iso, o) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const shortDay = iso => fmt(iso, { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '');
const monthDay = iso => fmt(iso, { month: 'short', day: 'numeric' });
// "Oct 3", with the year when it isn't this year
const niceDay = iso => iso.slice(0, 4) === todayIso().slice(0, 4) ? monthDay(iso) : fmt(iso, { month: 'short', day: 'numeric', year: 'numeric' });

// ---- Redraw guard: never while typing, with a sheet open, or just after a tap ----------
let lastDown = 0, pending = false;
document.addEventListener('pointerdown', () => { lastDown = Date.now(); }, true);
const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
const blocked = () => typing() || !!sheet || Date.now() - lastDown < 400;
function requestRender() { if (!pending) { pending = true; setTimeout(tryRender, 300); } }
function tryRender() { if (!pending) return; if (blocked()) { setTimeout(tryRender, 450); return; } render(); }
app.addEventListener('focusout', () => setTimeout(tryRender, 450));

function say(text, onUndo, ms) {
  toast.innerHTML = esc(text) + (onUndo ? ' <button type="button">Undo</button>' : '');
  if (onUndo) toast.querySelector('button').onclick = () => { toast.classList.remove('show'); onUndo(); };
  toast.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toast.classList.remove('show'), ms || (onUndo ? 6000 : 2600));
}

// ---- Saving ---------------------------------------------------------------------------
async function save(table, id, fields, key) {
  if (busy.has(key)) { say('Still saving. One moment.'); return false; }
  busy.add(key); render();
  try {
    await write([['UpdateRecord', table, id, fields]]);
    const row = tables()[table]?.find(r => r.id === id);
    if (row) Object.assign(row, fields);
    busy.delete(key); render();
    return true;
  } catch (e) {
    busy.delete(key); render();
    say(errMsg(e), null, 5000);
    return false;
  }
}
// Save, then offer Undo that puts the old values back.
async function changeWithUndo(table, id, fields, key, msg) {
  const row = tables()[table]?.find(r => r.id === id); if (!row) return;
  const before = Object.fromEntries(Object.keys(fields).map(k => [k, row[k] ?? null]));
  if (await save(table, id, fields, key)) say(msg, () => save(table, id, before, key));
}

// ---- Contact buttons --------------------------------------------------------------------
function contactBtns(c, optedOutOfEmail) {
  if (!c) return '';
  const digits = String(c.Phone || '').trim().replace(/[^\d+]/g, ''), email = String(c.Email || '').trim();
  const parts = [];
  if (digits) parts.push(`<a class="btn plain" href="tel:${esc(digits)}">Call</a><a class="btn plain" href="sms:${esc(digits)}">Text</a>`);
  if (email) parts.push(`<a class="btn plain" href="mailto:${esc(encodeURIComponent(email))}">Email</a>`);
  return (parts.length ? `<div class="contact">${parts.join('')}</div>` : '')
    + (email && optedOutOfEmail ? '<p class="note">Not on the email list. A personal note is fine; no newsletters.</p>' : '');
}

// ---- Sheets ---------------------------------------------------------------------------
// sheet = { init: {k: string}, save(), vals()? , sheetClick(e)? }
function showSheet() { sheetEl.hidden = false; sheetEl.scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeSheet() { sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = ''; document.body.style.overflow = ''; render(); }
const sheetVals = () => sheet.vals ? sheet.vals() : Object.fromEntries(Object.keys(sheet.init).map(k => [k, sheetEl.querySelector('#f-' + k)?.value ?? sheet.init[k]]));
const sheetDirty = () => { const v = sheetVals(); return Object.keys(sheet.init).some(k => v[k] !== sheet.init[k]); };
const sheetBars = `<div class="bar"><button type="submit" class="btn" data-sheet="save">Save</button><button type="button" class="btn plain" data-sheet="cancel">Cancel</button></div>
    <div class="bar" id="discard" hidden><button type="button" class="btn plain" data-sheet="keep">Keep editing</button><button type="button" class="btn" data-sheet="discard">Discard</button></div>`;
sheetEl.addEventListener('submit', e => { e.preventDefault(); if (sheet?.save) sheet.save(); });
sheetEl.addEventListener('click', e => {
  if (!sheet) return;
  if (sheet.sheetClick && sheet.sheetClick(e)) return;
  const act = e.target.closest('[data-sheet]')?.dataset.sheet;
  if (!act) return;
  if (act === 'cancel') { if (sheetDirty()) sheetEl.querySelector('#discard').hidden = false; else closeSheet(); }
  else if (act === 'keep') sheetEl.querySelector('#discard').hidden = true;
  else if (act === 'discard') closeSheet();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !sheet) return;
  const c = sheetEl.querySelector('[data-sheet=cancel]'); if (c) c.click(); else closeSheet();
});
// Save the sheet's changed fields to one record.
async function saveSheetRecord(table, id, fields, key) {
  if (!Object.keys(fields).length) { closeSheet(); return; }
  const mine = sheet, btn = sheetEl.querySelector('[data-sheet=save]'); btn.disabled = true;
  const ok = await save(table, id, fields, key);
  if (!ok) { if (sheet === mine) btn.disabled = false; return; }
  if (sheet === mine) closeSheet();
  say('Saved.');
}

// ---- Start ----------------------------------------------------------------------------
function start() {
  if (typeof grist === 'undefined') { loadFailed = true; render(); return; }
  grist.ready({ requiredAccess: 'full' });
  grist.onRecords(() => load());
  setInterval(() => { if (!document.hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setTimeout(() => { if (!loaded) { loadFailed = true; render(); } }, LOAD_MS);
  load();
  render();
}
const loadingHtml = () => loadFailed
  ? `<p>${esc(MSG_FAIL)}</p><button type="button" class="btn" data-act="retry">Try again</button>`
  : '<p class="hint">Loading…</p>';


// ---- Column choices, read from the doc so they stay in step with Grist -------------------
const choices = {};   // 'Table.Col' -> [labels]
let metaAt = 0;
async function loadMeta(want) {
  if (Date.now() - metaAt < 60000) return;
  const [tb, col] = await Promise.all(['_grist_Tables', '_grist_Tables_column'].map(n => grist.docApi.fetchTable(n)));
  const cols = rowsOf(col);
  for (const [t, names] of Object.entries(want)) {
    const ref = tb.id[tb.tableId.indexOf(t)];
    for (const n of names) {
      const c = cols.find(x => x.parentId === ref && x.colId === n);
      try { const ch = JSON.parse(c?.widgetOptions || '{}').choices; if (Array.isArray(ch) && ch.length) choices[t + '.' + n] = ch.map(String); } catch (e) {}
    }
  }
  metaAt = Date.now();
}
const choicesOf = (key, fallback) => choices[key] || fallback;
function optionsHtml(list, cur, blank) {
  const all = !cur || list.includes(cur) ? list : [...list, cur];
  return (blank ? `<option value=""${cur ? '' : ' selected'}>${esc(blank)}</option>` : '')
    + all.map(s => `<option${s === cur ? ' selected' : ''}>${esc(s)}</option>`).join('');
}

// ---- "Who" picker: an existing contact, or a new person made in the same save ------------
// add = { q, picked, isNew, first, last, email, phone, ... }
const pickInp = (add, n, label, type, extra = '') => `<label class="f"><span class="label">${label}</span><input data-add="${n}" type="${type}" value="${esc(add[n])}" autocomplete="off" ${extra}></label>`;
function pickResults(add) {
  const q = add.q.trim().toLowerCase();
  const found = (q ? contacts.filter(c => String(c.Name || '').toLowerCase().includes(q)) : contacts.slice())
    .sort((a, b) => String(a.Name).localeCompare(String(b.Name))).slice(0, 8);
  return found.map(c => `<button type="button" class="btn plain" data-pick="pick" data-id="${c.id}" aria-pressed="${add.picked === c.id}">${esc(c.Name || '(no name)')}</button>`).join('') || '<p class="empty">No match.</p>';
}
function pickerHtml(add, who) {
  return add.isNew
    ? `${pickInp(add, 'first', 'First name', 'text')}${pickInp(add, 'last', 'Last name', 'text')}${pickInp(add, 'email', 'Email', 'email')}${pickInp(add, 'phone', 'Phone', 'tel')}
      <button type="button" class="link" data-pick="existing">Pick an existing contact instead</button>`
    : `${pickInp(add, 'q', who, 'search', 'enterkeyhint="search"')}
      <div class="results" id="pk-results">${pickResults(add)}</div>
      <button type="button" class="link" data-pick="new">New person</button>`;
}
// Returns the contact to use: { id, action|null }. A new person gets a row id picked up front so the
// contact and the record that points at it go in ONE applyUserActions call (one Undo).
async function resolveContact(add) {
  if (!add.isNew) return { id: add.picked, action: null };
  const t = await withTimeout(grist.docApi.fetchTable('Contacts'));
  const id = Math.max(0, ...t.id.map(Number)) + 1;
  return { id, action: ['AddRecord', 'Contacts', id, { First_Name: add.first.trim(), Last_Name: add.last.trim(), Email: add.email.trim(), Phone: add.phone.trim() }] };
}
function checkWho(add) {
  if (add.isNew) return add.first.trim() || add.last.trim() ? '' : 'Add at least a first or last name.';
  return add.picked ? '' : 'Pick a person first, or choose New person.';
}
// Typing and tapping inside the add sheet. Returns true when it handled the event.
function pickerInput(add, e) {
  const k = e.target.dataset.add; if (!k) return false;
  add[k] = e.target.value;
  if (k === 'q') { const r = document.getElementById('pk-results'); if (r) r.innerHTML = pickResults(add); }
  return true;
}
function pickerClick(add, e, redraw) {
  const el = e.target.closest('[data-pick]'); if (!el) return false;
  const a = el.dataset.pick;
  if (a === 'pick') add.picked = Number(el.dataset.id);
  else if (a === 'new') { add.isNew = true; add.picked = null; }
  else if (a === 'existing') add.isNew = false;
  redraw(); return true;
}

// Reads Registrations, Workshops and Contacts by name (full access).
// The Payment buttons are the Registrations.Payment_Buttons action buttons, run the same way Workshop day runs them.
let regs = [], workshops = [], contacts = [], q = '', filter = 'Pending', add = null;
const tables = () => ({ Registrations: regs, Workshops: workshops });
const OUT = ['Cancelled', 'Refunded'];   // registrations that are not coming
const FILTERS = [['Pending', 'Owes money'], ['Waitlist', 'Waitlist'], ['Paid', 'Paid'], ['All', 'All']];
const EARLIER_DAYS = 60;
const DEF_STATUS = ['Paid', 'Pending', 'Comped', 'Waitlist', 'Refunded', 'Cancelled'];
const DEF_METHOD = ['Square', 'Venmo', 'Cash', 'Gift card', 'Other'];
const money = n => { const v = Math.round((Number(n) || 0) * 100) / 100; return '$' + (v % 1 ? v.toFixed(2) : String(v)); };

// An Action Button cell as a list of {button, description, actions: [[Action, Table, id, {fields}], ...]}.
function buttonsOf(raw) {
  const d = decode(raw);
  const list = Array.isArray(d) ? d : d ? [d] : [];
  return list.filter(x => x && typeof x === 'object' && !Array.isArray(x) && x.button).map(x => ({
    button: String(x.button), description: String(x.description || ''),
    actions: (Array.isArray(x.actions) ? x.actions : []).filter(a => Array.isArray(a) && typeof a[0] === 'string'),
  }));
}
function actionButtons(entries, keyBase) {
  return entries.map((e, i) => e.actions.length
    ? `<button type="button" class="btn plain" data-act="run" data-key="${esc(keyBase)}" data-i="${i}"${busy.has(keyBase) ? ' disabled' : ''}>${esc(e.button)}</button>`
    : `<p class="note">${esc(e.button)}</p>`).join('');
}
// Run an Action Button entry: apply its actions exactly as Grist would. UpdateRecord actions get an Undo.
async function runEntry(entry, key) {
  if (busy.has(key)) { say('Still saving. One moment.'); return; }
  const undo = [];
  for (const a of entry.actions) {
    const [kind, table, id, fields] = a, row = tables()[table]?.find(r => r.id === id);
    if (kind === 'UpdateRecord' && row && fields && typeof fields === 'object') {
      undo.push(['UpdateRecord', table, id, Object.fromEntries(Object.keys(fields).map(k => [k, row[k] ?? null]))]);
    } else { undo.length = 0; undo.push(null); break; }
  }
  const canUndo = undo.length && undo[0] !== null;
  busy.add(key); render();
  try {
    await write(entry.actions);
    busy.delete(key);
    say('Done.', canUndo ? async () => {
      try { await write(undo); await load(); say('Undone.'); } catch (e) { say(errMsg(e), null, 5000); }
    } : null);
    await load(); render();
  } catch (e) {
    busy.delete(key); render();
    say(errMsg(e), null, 5000);
  }
}

async function load() {
  const seq = ++loadSeq;
  try {
    const res = await Promise.allSettled(['Registrations', 'Workshops', 'Contacts'].map(n => grist.docApi.fetchTable(n)));
    if (res[0].status === 'rejected' || res[1].status === 'rejected') throw new Error('load');
    const [r, w, c] = res.map(x => x.status === 'fulfilled' ? rowsOf(x.value) : []);
    await loadMeta({ Registrations: ['Status', 'Payment_Method'] }).catch(() => {});
    if (seq !== loadSeq) return;
    regs = r; workshops = w; contacts = c; loaded = true; loadFailed = false;
  } catch (e) {
    if (seq !== loadSeq) return;
    if (!loaded) { loadFailed = true; render(); }
    return;
  }
  requestRender();
}

const contactOf = r => contacts.find(c => c.id === refId(r.Contact)) || null;
const nameOf = r => String(r.Attendee_Name || contactOf(r)?.Name || '').trim() || '(no name)';
const byName = (a, b) => nameOf(a).localeCompare(nameOf(b));
const hay = r => [nameOf(r), r.Guest_Name].join(' ').toLowerCase();

function card(r) {
  const p = busy.has('reg' + r.id), entries = buttonsOf(r.Payment_Buttons);
  const seats = Number(r.Seats) || 1;
  const exp = r.Expected == null || r.Expected === '' ? null : Number(r.Expected);
  const chip = `<span class="chip${r.Status === 'Paid' || r.Status === 'Comped' ? ' paid' : r.Status === 'Pending' ? ' pending' : ''}">${esc(r.Status || 'No status')}</span>`;
  const meta = [r.Guest_Name ? `with ${r.Guest_Name}` : '', `${seats} ${seats === 1 ? 'seat' : 'seats'}`].filter(Boolean).join(' · ');
  return `<div class="card${OUT.includes(r.Status) ? ' out' : ''}${p ? ' pending' : ''}">
    <div class="row"><button type="button" class="title" data-act="open" data-id="${r.id}">${esc(nameOf(r))}</button>${chip}</div>
    <p class="meta">${esc(meta)}${p ? ' · Saving…' : ''}</p>
    <p class="meta paidline">Paid ${esc(money(r.Amount_Paid))}${exp != null && Number.isFinite(exp) ? ` of ${esc(money(exp))}` : ''}</p>
    ${r.Check ? `<p class="warn">${esc(r.Check)}</p>` : ''}
    ${contactBtns(contactOf(r), false)}
    ${entries.length ? `<div class="acts">${actionButtons(entries, 'reg' + r.id)}</div>` : ''}
  </div>`;
}
function seatsLine(w) {
  const cap = Number(w.Capacity);
  const taken = w.Seats_Taken != null && Number.isFinite(Number(w.Seats_Taken)) ? Number(w.Seats_Taken)
    : regs.filter(r => refId(r.Workshop) === w.id && ['Paid', 'Pending', 'Comped'].includes(r.Status)).reduce((n, r) => n + (Number(r.Seats) || 1), 0);
  return cap > 0 ? `${taken} of ${cap} seats` : `${taken} seats`;
}
function groupHtml({ w, iso }) {
  const t = q.trim().toLowerCase();
  const list = regs.filter(r => refId(r.Workshop) === w.id && (filter === 'All' || r.Status === filter) && (!t || hay(r).includes(t))).sort(byName);
  if (!list.length) return '';
  return `<h2><span class="t">${esc(shortDay(iso))} · ${esc(w.Title || 'Workshop')}</span><span>${esc(seatsLine(w))}</span></h2>${list.map(card).join('')}`;
}
function listHtml() {
  const today = todayIso();
  const all = workshops.filter(w => w.Status !== 'Cancelled' && isoDay(w.Date)).map(w => ({ w, iso: isoDay(w.Date) }));
  const up = all.filter(x => x.iso >= today).sort((a, b) => a.iso < b.iso ? -1 : 1);
  const past = all.filter(x => x.iso < today && dayDiff(x.iso, today) <= EARLIER_DAYS).sort((a, b) => a.iso < b.iso ? 1 : -1);
  const upHtml = up.map(groupHtml).join(''), pastHtml = past.map(groupHtml).join('');
  const none = { Pending: 'Nobody owes money right now.', Waitlist: 'Nobody is on a waitlist.', Paid: 'Nobody is marked Paid yet.', All: 'Nobody is booked yet.' }[filter];
  return (upHtml || `<p class="empty">${esc(q.trim() ? 'No booking matches that.' : up.length ? none : 'No upcoming workshops yet.')}</p>`)
    + (pastHtml ? `<details class="fold"><summary>Earlier (last ${EARLIER_DAYS} days)</summary>${pastHtml}</details>` : '');
}
function render() {
  pending = false;
  if (!loaded) { app.innerHTML = loadingHtml(); return; }
  const n = s => s === 'All' ? regs.length : regs.filter(r => r.Status === s).length;
  app.innerHTML = `
    <h1><em>Bookings</em></h1>
    <p class="hint">Everyone booked on upcoming workshops. Tap a payment button when the money comes in.</p>
    <button type="button" class="btn addbtn" data-act="add-open">+ Add a booking</button>
    <label class="f"><span class="label">Search by name</span><input id="q" type="search" enterkeyhint="search" autocomplete="off" value="${esc(q)}"></label>
    <div class="chips">${FILTERS.map(([k, label]) => `<button type="button" class="chipbtn" data-act="filter" data-f="${k}" aria-pressed="${filter === k}">${label}</button>`).join('')}</div>
    <div id="out">${listHtml()}</div>`;
}
const redrawOut = () => { const o = document.getElementById('out'); if (o) o.innerHTML = listHtml(); };
app.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; redrawOut(); } });

// ---- Edit a booking ---------------------------------------------------------------------
function openEdit(id) {
  const r = regs.find(x => x.id === id); if (!r) return;
  const init = { Notes: String(r.Notes ?? ''), Seats: String(Number(r.Seats) || 1), Status: String(r.Status ?? ''), Payment_Method: String(r.Payment_Method ?? ''),
    Discount_Code: String(r.Discount_Code ?? ''), Discount_Reason: String(r.Discount_Reason ?? '') };
  sheet = { init, save: () => saveEdit(id) };
  const txt = (k, label) => `<label class="f"><span class="label">${label}</span><input id="f-${k}" type="text" autocomplete="off" value="${esc(init[k])}"></label>`;
  sheetEl.innerHTML = `<form class="inner"><h1>${esc(nameOf(r))}</h1>
    ${r.Check ? `<p class="warn">${esc(r.Check)}</p>` : ''}
    <label class="f"><span class="label">Seats</span><input id="f-Seats" type="number" min="1" step="1" inputmode="numeric" value="${esc(init.Seats)}"></label>
    <label class="f"><span class="label">Status</span><select id="f-Status">${optionsHtml(choicesOf('Registrations.Status', DEF_STATUS), init.Status)}</select></label>
    <label class="f"><span class="label">Payment method</span><select id="f-Payment_Method">${optionsHtml(choicesOf('Registrations.Payment_Method', DEF_METHOD), init.Payment_Method, 'Not set')}</select></label>
    ${txt('Discount_Code', 'Discount code')}${txt('Discount_Reason', 'Discount reason')}
    <label class="f"><span class="label">Notes</span><textarea id="f-Notes" rows="4">${esc(init.Notes)}</textarea></label>
    ${sheetBars}</form>`;
  showSheet();
}
async function saveEdit(id) {
  const r = regs.find(x => x.id === id); if (!r) return;
  const v = sheetVals(), init = sheet.init, fields = {};
  for (const k of Object.keys(init)) if (v[k] !== init[k]) fields[k] = v[k];
  if ('Seats' in fields) {
    const n = Math.floor(Number(fields.Seats));
    if (!(n >= 1)) { say('Seats needs a number, 1 or more.'); return; }
    fields.Seats = n;
  }
  if (!Object.keys(fields).length) { closeSheet(); return; }
  const before = Object.fromEntries(Object.keys(fields).map(k => [k, r[k] ?? (k === 'Seats' ? 1 : '')]));
  const mine = sheet, btn = sheetEl.querySelector('[data-sheet=save]'); btn.disabled = true;
  if (!await save('Registrations', id, fields, 'reg' + id)) { if (sheet === mine) btn.disabled = false; return; }
  if (sheet === mine) closeSheet();
  say('Saved.', () => save('Registrations', id, before, 'reg' + id));
}

// ---- Add a booking ----------------------------------------------------------------------
function upcomingWs() {
  const today = todayIso();
  return workshops.filter(w => !['Cancelled', 'Done'].includes(w.Status) && isoDay(w.Date) && isoDay(w.Date) >= today)
    .sort((a, b) => isoDay(a.Date) < isoDay(b.Date) ? -1 : 1);
}
function openAddBooking() {
  const ws = upcomingWs();
  if (!ws.length) { say('No upcoming workshops to book onto.'); return; }
  add = { q: '', picked: null, isNew: false, first: '', last: '', email: '', phone: '', ws: String(ws[0].id), seats: '1' };
  sheet = { init: {}, save: saveBooking, sheetClick: e => pickerClick(add, e, drawAdd) || (e.target.closest('[data-sheet=close]') ? (closeSheet(), true) : false) };
  drawAdd(); showSheet();
}
function drawAdd() {
  const ws = upcomingWs();
  sheetEl.innerHTML = `<form class="inner" novalidate><h1>Add a <em>booking</em></h1>
    <label class="f"><span class="label">Workshop</span><select data-add="ws">${ws.map(w => `<option value="${w.id}"${String(w.id) === add.ws ? ' selected' : ''}>${esc(`${w.Title || 'Workshop'}, ${monthDay(isoDay(w.Date))}`)}</option>`).join('')}</select></label>
    <div style="display:grid;gap:10px"><span class="label" style="color:var(--moss)">Who</span>${pickerHtml(add, 'Find a contact')}</div>
    ${pickInp(add, 'seats', 'Seats', 'number', 'min="1" step="1" inputmode="numeric"')}
    <p class="note">It starts as Pending. Use the payment buttons when the money comes in.</p>
    <p class="warn" id="add-err" hidden></p>
    <div class="bar"><button type="submit" class="btn" id="add-save">Add as Pending</button><button type="button" class="btn plain" data-sheet="close">Cancel</button></div>
  </form>`;
}
const addErr = m => { const el = document.getElementById('add-err'); if (el) { el.textContent = m; el.hidden = !m; } if (m) say(m, null, 4000); };
sheetEl.addEventListener('input', e => { if (add) pickerInput(add, e); });
sheetEl.addEventListener('change', e => { if (add && e.target.tagName === 'SELECT') pickerInput(add, e); });
async function saveBooking() {
  const a = add; if (!a) return;
  const seats = Math.floor(Number(a.seats));
  if (!(seats >= 1)) return addErr('Seats needs a number, 1 or more.');
  const who = checkWho(a); if (who) return addErr(who);
  const btn = document.getElementById('add-save'); btn.disabled = true;
  const mine = sheet;
  try {
    const c = await resolveContact(a);
    const acts = c.action ? [c.action] : [];
    acts.push(['AddRecord', 'Registrations', null, { Contact: c.id, Workshop: Number(a.ws), Seats: seats, Status: 'Pending' }]);
    const res = await write(acts);   // contact (if new) and booking together: one Undo
    const rid = Number(res?.retValues?.[acts.length - 1]) || null;
    if (sheet === mine) { add = null; closeSheet(); }
    const undo = rid ? [['RemoveRecord', 'Registrations', rid], ...(c.action ? [['RemoveRecord', 'Contacts', c.id]] : [])] : null;
    say('Added as Pending.', undo ? async () => { try { await write(undo); await load(); say('Undone.'); } catch (err) { say(errMsg(err), null, 5000); } } : null);
    await load();
  } catch (err) { if (btn.isConnected) btn.disabled = false; say(errMsg(err), null, 5000); }
}

app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = Number(el.dataset.id);
  switch (el.dataset.act) {
    case 'retry': loadFailed = false; render(); load(); break;
    case 'open': openEdit(id); break;
    case 'add-open': openAddBooking(); break;
    case 'filter': filter = el.dataset.f; render(); break;
    case 'run': {
      const key = el.dataset.key, i = Number(el.dataset.i);
      const r = regs.find(x => x.id === Number(key.slice(3))), entries = buttonsOf(r?.Payment_Buttons);
      if (entries[i]) runEntry(entries[i], key);
      break;
    }
  }
});
start();
</script>
