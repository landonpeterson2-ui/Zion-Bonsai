<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zion Bonsai workshop day (Grist widget)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<!-- A Grist custom widget: run one workshop from a phone (checklist, check-in, guests).
     Put it on the Workshops table. No column mapping. Only works inside Grist. -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --paper: #F4EEE6; --paper-deep: #E9DFD2; --sandstone: #D9AE93; --linen: #FBF8F3;
    --clay: #A84A2B; --clay-dark: #8F3E23; --moss: #4F6420; --forest: #2F3B22;
    --rule: rgba(47, 59, 34, .15); --edge: rgba(47, 59, 34, .4);
    --late-bg: rgba(168, 74, 43, .13); --soon-bg: rgba(217, 174, 147, .4);
    --radius: 3px;
    --sans: 'Open Sans', system-ui, sans-serif;
    --label: 'Montserrat', 'Open Sans', system-ui, sans-serif;
    --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--forest); font: 400 16px/1.5 var(--sans); }
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 80px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  h1 { font: 500 34px/1.1 var(--display); margin: 4px 0 4px; }
  h1 em { font-style: italic; }
  h2 { font: 600 11px/1.2 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--moss);
       margin: 28px 0 10px; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; }
  .label { font: 600 11px/1.2 var(--label); letter-spacing: .16em; text-transform: uppercase; }
  .hint { color: var(--moss); font-size: 14px; margin: 4px 0; }
  .empty { color: var(--moss); padding: 6px 2px 10px; }
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  .btn { font: 600 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; min-height: 44px; padding: 0 18px;
         border: 1px solid var(--clay); border-radius: var(--radius); background: var(--clay); color: var(--linen); cursor: pointer; }
  .btn:hover { background: var(--clay-dark); border-color: var(--clay-dark); }
  .btn.plain { background: var(--linen); color: var(--forest); border-color: var(--edge); }
  .btn.plain:hover { background: var(--paper-deep); }
  .btn:disabled { opacity: .55; cursor: default; }
  .link { background: none; border: 0; padding: 0; min-height: 44px; display: inline-flex; align-items: center;
          color: var(--clay); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15px; }
  .people { display: grid; gap: 10px; margin-top: 14px; }
  .people .btn { min-height: 56px; font-size: 13px; text-align: left; padding: 0 20px; }
  .next { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; margin: 10px 0 4px; }
  .next b { font-weight: 600; }
  .card { background: var(--linen); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .card.late { background: var(--late-bg); border-color: rgba(168, 74, 43, .35); }
  .card.soon { background: var(--soon-bg); border-color: rgba(217, 174, 147, .9); }
  .card.done { opacity: .6; }
  .card.pending { opacity: .6; }
  .card .title { font-weight: 600; overflow-wrap: anywhere; cursor: pointer; min-height: 44px; display: flex; align-items: center;
                 background: none; border: 0; padding: 0; text-align: left; width: 100%; }
  .card .meta { color: var(--forest); font-size: 14px; margin: 0 0 10px; opacity: .85; }
  .card.late .meta { opacity: 1; font-weight: 600; }
  .card .donebtn { width: 100%; min-height: 48px; }
  .card .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  details.fold { margin-top: 18px; }
  details.fold summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--clay);
                         font: 600 11px/1.2 var(--label); letter-spacing: .16em; text-transform: uppercase; }
  .addbtn { width: 100%; min-height: 48px; margin-bottom: 10px; }
  form.add { display: grid; gap: 10px; margin-bottom: 12px; background: var(--linen); border: 1px solid var(--rule);
             border-radius: var(--radius); padding: 14px; }
  label.f { display: grid; gap: 4px; }
  label.f .label { color: var(--moss); }
  input, select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: var(--radius);
                            background: var(--paper); color: var(--forest); }
  textarea { min-height: 96px; resize: vertical; }
  input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .bar { display: flex; gap: 10px; }
  .bar .btn { flex: 1; }
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--paper); overflow-y: auto; }
  #sheet .inner { max-width: 640px; margin: 0 auto; padding: 18px 14px 40px; display: grid; gap: 14px; }
  #sheet h1 { font-size: 28px; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--forest); color: var(--linen); z-index: 20;
           padding: 8px 8px 8px 16px; border-radius: var(--radius); opacity: 0; transition: opacity .2s; pointer-events: none;
           display: flex; gap: 10px; align-items: center; max-width: calc(100% - 24px); }
  #toast.show { opacity: 1; pointer-events: auto; }
  #toast button { background: none; border: 1px solid rgba(251, 248, 243, .5); color: var(--linen); border-radius: var(--radius);
                  font: 600 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; min-height: 44px; padding: 0 14px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  .summary { margin: 8px 0 0; }
  .summary b { font-weight: 600; }
  .toggles { display: grid; gap: 10px; }
  .toggle { width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center; text-align: left;
            padding: 0 16px; background: var(--linen); color: var(--forest); border: 1px solid var(--edge); border-radius: var(--radius);
            font: 600 12px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
  .toggle[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .toggle:disabled { opacity: .55; cursor: default; }
  .acts { display: grid; gap: 8px; margin-top: 10px; }
  .acts .btn { width: 100%; min-height: 48px; text-align: left; padding: 10px 16px; line-height: 1.3; }
  .note { color: var(--moss); font-size: 14px; margin: 6px 0 0; }
  .warn { margin: 0 0 10px; padding: 8px 10px; background: var(--late-bg); border: 1px solid rgba(168, 74, 43, .35);
          border-radius: var(--radius); font-size: 14px; font-weight: 600; }
  .chip { display: inline-block; font: 600 10px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px;
          border: 1px solid var(--edge); border-radius: var(--radius); background: var(--paper); }
  .chip.paid { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .chip.pending { background: var(--soon-bg); border-color: rgba(217, 174, 147, .9); }
  .card.out { opacity: .6; }
  .card .hereb { width: 100%; min-height: 52px; margin-top: 4px; }
  .card .hereb[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .pick { margin: 8px 0 0; }
  .results { display: grid; gap: 6px; }
  .results .btn { text-align: left; min-height: 44px; }
  .results .btn[aria-pressed=true] { background: var(--moss); border-color: var(--moss); color: var(--linen); }
  .contact { display: flex; flex-wrap: wrap; gap: 8px; }
  .contact a { flex: 1; min-width: 90px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .bar .btn[type=submit] { flex: 1; }
</style>
</head>
<body>
<main id="app"><p class="hint">This is a Grist custom widget. Open it inside Grist.</p></main>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Details"></div>
<div id="toast" role="status"></div>
<script>
// Reads Workshops, Registrations, Contacts, Trees and Feedback by name (full access).
// The workshop you pick is remembered for this session only.
const PICK_KEY = 'zb-workshop-day-pick';
const SAVE_MS = 10000, LOAD_MS = 20000;
const MSG_FAIL = "Couldn't load. Check your connection.";
const MSG_SAVE = "Couldn't save. Check your connection and try again.";
const MSG_ACCESS = "That can't be changed here. Ask Landon if you think it should be.";
const OUT = ['Cancelled', 'Refunded'];   // registrations that are not coming
const CHECKS = [['Group_Photo', 'Group photo'], ['Care_Sent', 'Care sent'], ['Survey_Sent', 'Survey sent']];

let workshops = [], regs = [], contacts = [], trees = [], feedback = [];
let statuses = ['Paid', 'Pending', 'Comped', 'Waitlist', 'Refunded', 'Cancelled'];   // from the Status column's choices
let wsId = null, loaded = false, loadFailed = false, loadSeq = 0, metaAt = 0;
let sheet = null;
const busy = new Set();

const app = document.getElementById('app');
const sheetEl = document.getElementById('sheet');
const toast = document.getElementById('toast');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function recall() { try { return Number(sessionStorage.getItem(PICK_KEY)) || null; } catch (e) { return null; } }
function remember(n) { try { if (n) sessionStorage.setItem(PICK_KEY, String(n)); else sessionStorage.removeItem(PICK_KEY); } catch (e) {} }

const withTimeout = (p, ms = SAVE_MS) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(new Error('timeout')), ms);
  Promise.resolve(p).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
});
const write = acts => withTimeout(grist.docApi.applyUserActions(acts));
function errMsg(e) {
  if (!navigator.onLine) return MSG_SAVE;
  return /access|permission|blocked|denied/i.test(String(e?.message ?? e)) ? MSG_ACCESS : MSG_SAVE;
}
function rowsOf(t) { return t.id.map((id, i) => Object.fromEntries(Object.keys(t).map(k => [k, t[k][i]]))); }

// ---- Grist's encoded cell values --------------------------------------------------------
// Formula columns holding a list or dict can arrive as ["L", ...] and ["O", {...}] (nested).
// Plain arrays and objects (already decoded) pass through unchanged.
function decode(v) {
  if (Array.isArray(v)) {
    if (v[0] === 'L') return v.slice(1).map(decode);
    if (v[0] === 'O' && v.length === 2 && v[1] && typeof v[1] === 'object') return Object.fromEntries(Object.entries(v[1]).map(([k, x]) => [k, decode(x)]));
    if (v[0] === 'E' || v[0] === 'P' || v[0] === 'C') return null;
    return v.map(decode);
  }
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, decode(x)]));
  return v;
}
// An Action Button cell as a list of {button, description, actions: [[Action, Table, id, {fields}], ...]}.
function buttonsOf(raw) {
  const d = decode(raw);
  const list = Array.isArray(d) ? d : d ? [d] : [];
  return list.filter(x => x && typeof x === 'object' && !Array.isArray(x) && x.button).map(x => ({
    button: String(x.button), description: String(x.description || ''),
    actions: (Array.isArray(x.actions) ? x.actions : []).filter(a => Array.isArray(a) && typeof a[0] === 'string'),
  }));
}

// ---- Dates: Grist Date cells are seconds at UTC midnight -------------------------------
function todayIso() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function isoDay(v) {
  if (v == null || v === '') return null;
  const secs = v instanceof Date ? v.getTime() / 1000 : Number(v);
  if (!Number.isFinite(secs) || secs <= 0) return null;
  if (secs % 86400 === 0) return new Date(secs * 1000).toISOString().slice(0, 10);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date(secs * 1000)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const fmt = (iso, o) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const longDay = iso => fmt(iso, { weekday: 'long', month: 'long', day: 'numeric' });

// ---- Loading --------------------------------------------------------------------------
async function loadMeta() {
  if (Date.now() - metaAt < 60000) return;
  const [tb, col] = await Promise.all(['_grist_Tables', '_grist_Tables_column'].map(n => grist.docApi.fetchTable(n)));
  const ref = tb.id[tb.tableId.indexOf('Registrations')];
  const status = rowsOf(col).find(c => c.parentId === ref && c.colId === 'Status');
  try {
    const ch = JSON.parse(status?.widgetOptions || '{}').choices;
    if (Array.isArray(ch) && ch.length) statuses = ch.map(String);
  } catch (e) {}
  metaAt = Date.now();
}
async function load() {
  const seq = ++loadSeq;
  try {
    const names = ['Workshops', 'Registrations', 'Contacts', 'Trees', 'Feedback'];
    const res = await Promise.allSettled(names.map(n => grist.docApi.fetchTable(n)));
    if (res[0].status === 'rejected' || res[1].status === 'rejected') throw new Error('load');
    const [w, r, c, t, f] = res.map(x => x.status === 'fulfilled' ? rowsOf(x.value) : []);
    await loadMeta().catch(() => {});
    if (seq !== loadSeq) return;
    workshops = w; regs = r; contacts = c; trees = t; feedback = f;
    loaded = true; loadFailed = false;
  } catch (e) {
    if (seq !== loadSeq) return;
    if (!loaded) { loadFailed = true; render(); }
    return;
  }
  if (!workshops.some(w => w.id === wsId)) wsId = defaultWorkshop();
  requestRender();
}

// ---- Redraw guard: never while typing, with a sheet open, or just after a tap ----------
let lastDown = 0, pending = false;
document.addEventListener('pointerdown', () => { lastDown = Date.now(); }, true);
const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
const blocked = () => typing() || !!sheet || Date.now() - lastDown < 400;
function requestRender() { if (!pending) { pending = true; setTimeout(tryRender, 300); } }
function tryRender() { if (!pending) return; if (blocked()) { setTimeout(tryRender, 450); return; } render(); }
app.addEventListener('focusout', () => setTimeout(tryRender, 450));

function say(text, onUndo, ms) {
  toast.innerHTML = esc(text) + (onUndo ? ' <button type="button">Undo</button>' : '');
  if (onUndo) toast.querySelector('button').onclick = () => { toast.classList.remove('show'); onUndo(); };
  toast.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toast.classList.remove('show'), ms || (onUndo ? 6000 : 2600));
}

// ---- Workshops ------------------------------------------------------------------------
const pickable = () => workshops.filter(w => w.Status !== 'Cancelled' && isoDay(w.Date));
function defaultWorkshop() {
  const remembered = recall();
  if (remembered && workshops.some(w => w.id === remembered)) return remembered;
  const today = todayIso(), list = pickable().map(w => ({ id: w.id, iso: isoDay(w.Date) }));
  const hit = list.find(x => x.iso === today)
    || list.filter(x => x.iso > today).sort((a, b) => a.iso < b.iso ? -1 : 1)[0]
    || list.sort((a, b) => a.iso < b.iso ? 1 : -1)[0];
  return hit ? hit.id : null;
}
function wsOptions() {
  const today = todayIso();
  const list = pickable().map(w => ({ w, iso: isoDay(w.Date) }));
  const up = list.filter(x => x.iso >= today).sort((a, b) => a.iso < b.iso ? -1 : 1);
  const past = list.filter(x => x.iso < today).sort((a, b) => a.iso < b.iso ? 1 : -1);
  return [...up, ...past].map(x => `<option value="${x.w.id}"${x.w.id === wsId ? ' selected' : ''}>${esc(`${x.w.Title || 'Workshop'}, ${fmt(x.iso, { month: 'short', day: 'numeric' })}`)}</option>`).join('');
}
function seatsSummary(w, guests) {
  const cap = Number(w.Capacity);
  const taken = Number.isFinite(Number(w.Seats_Taken)) && w.Seats_Taken !== null ? Number(w.Seats_Taken)
    : guests.filter(r => ['Paid', 'Pending', 'Comped'].includes(r.Status)).reduce((n, r) => n + (Number(r.Seats) || 1), 0);
  return cap > 0 ? `${taken} of ${cap} seats taken` : `${taken} seats taken`;
}

// ---- Guests ---------------------------------------------------------------------------
const contactOf = r => contacts.find(c => c.id === Number(r.Contact)) || null;
const nameOf = r => String(r.Attendee_Name || contactOf(r)?.Name || '').trim();
const byName = (a, b) => nameOf(a).localeCompare(nameOf(b));
const tables = () => ({ Registrations: regs, Workshops: workshops });

function actionButtons(entries, keyBase) {
  return entries.map((e, i) => e.actions.length
    ? `<button type="button" class="btn plain" data-act="run" data-key="${esc(keyBase)}" data-i="${i}"${busy.has(keyBase) ? ' disabled' : ''}>${esc(e.button)}</button>`
    : `<p class="note">${esc(e.button)}</p>`).join('');
}
function guestCard(r) {
  const out = OUT.includes(r.Status), p = busy.has('reg' + r.id), entries = buttonsOf(r.Payment_Buttons);
  const meta = [r.Guest_Name ? `with ${r.Guest_Name}` : '', `${Number(r.Seats) || 1} ${Number(r.Seats) === 1 || !Number(r.Seats) ? 'seat' : 'seats'}`].filter(Boolean).join(' · ');
  const chip = `<span class="chip${r.Status === 'Paid' || r.Status === 'Comped' ? ' paid' : r.Status === 'Pending' ? ' pending' : ''}">${esc(r.Status || 'No status')}</span>`;
  return `<div class="card${out ? ' out' : ''}${p ? ' pending' : ''}">
    <div class="row"><button type="button" class="title" data-act="open" data-id="${r.id}">${esc(nameOf(r)) || '(no name)'}</button>${chip}</div>
    <p class="meta">${esc(meta)}${p ? ' · Saving…' : ''}</p>
    ${r.Check ? `<p class="warn">${esc(r.Check)}</p>` : ''}
    <button type="button" class="btn plain hereb" data-act="here" data-id="${r.id}" aria-pressed="${r.Attended ? 'true' : 'false'}"${p || out ? ' disabled' : ''}>${r.Attended ? 'Here' : 'Mark here'}</button>
    ${entries.length ? `<div class="acts">${actionButtons(entries, 'reg' + r.id)}</div>` : ''}
  </div>`;
}
function render() {
  pending = false;
  if (!loaded) {
    app.innerHTML = loadFailed
      ? `<p>${esc(MSG_FAIL)}</p><button type="button" class="btn" data-act="retry">Try again</button>`
      : '<p class="hint">Loading…</p>';
    return;
  }
  const w = workshops.find(x => x.id === wsId);
  if (!w) {
    app.innerHTML = '<h1>Workshop <em>day</em></h1><p class="empty">No workshops yet.</p>';
    return;
  }
  const iso = isoDay(w.Date);
  const guests = regs.filter(r => Number(r.Workshop) === w.id).sort(byName);
  const myTrees = trees.filter(t => Number(t.Workshop) === w.id);
  const myFb = feedback.filter(f => Number(f.Workshop) === w.id);
  const rated = myFb.map(f => Number(f.Rating)).filter(n => n > 0);
  const avg = rated.length ? (rated.reduce((a, b) => a + b, 0) / rated.length).toFixed(1) : '';
  const checkIn = buttonsOf(w.Check_In_Button);
  app.innerHTML = `
    <h1>Workshop <em>day</em></h1>
    <p class="hint">Pick the workshop. Tap Here as people arrive.</p>
    <label class="f pick"><span class="label">Workshop</span><select data-pick>${wsOptions()}</select></label>
    <p class="summary"><b>${esc(w.Title || 'Workshop')}</b><br>${esc([iso ? longDay(iso) : '', w.Time].filter(Boolean).join(' · '))}<br>${esc(seatsSummary(w, guests))}</p>
    <h2><span>Checklist</span></h2>
    <div class="toggles">${CHECKS.map(([col, label]) =>
      `<button type="button" class="toggle" data-act="check" data-col="${col}" aria-pressed="${w[col] ? 'true' : 'false'}"${busy.has('ws' + col) ? ' disabled' : ''}><span>${esc(label)}</span><span>${w[col] ? 'Done' : 'Not yet'}</span></button>`).join('')}</div>
    ${checkIn.length ? `<h2><span>Check-in</span></h2><div class="acts" style="margin-top:0">${actionButtons(checkIn, 'checkin')}</div>` : ''}
    <h2><span>Guests</span><span>${guests.filter(r => !OUT.includes(r.Status)).length}</span></h2>
    <button type="button" class="btn addbtn" data-act="add-open">+ Add a guest</button>
    ${guests.map(guestCard).join('') || '<p class="empty">Nobody signed up yet.</p>'}
    <details class="fold"><summary>Trees potted here (${myTrees.length})</summary>
      ${myTrees.length ? myTrees.map(t => `<p class="meta">${esc(t.Species || 'Tree')}${contacts.find(c => c.id === Number(t.Owner)) ? ' — ' + esc(contacts.find(c => c.id === Number(t.Owner)).Name) : ''}</p>`).join('') : '<p class="empty">None yet.</p>'}</details>
    <details class="fold"><summary>Feedback (${myFb.length})</summary>
      <p class="meta">${myFb.length ? esc(`${myFb.length} ${myFb.length === 1 ? 'response' : 'responses'}${avg ? ', average rating ' + avg : ''}`) : 'No feedback yet.'}</p></details>`;
}

// ---- Saving ---------------------------------------------------------------------------
async function save(table, id, fields, key) {
  if (busy.has(key)) { say('Still saving. One moment.'); return false; }
  busy.add(key); render();
  try {
    await write([['UpdateRecord', table, id, fields]]);
    const row = tables()[table]?.find(r => r.id === id);
    if (row) Object.assign(row, fields);
    busy.delete(key); render();
    return true;
  } catch (e) {
    busy.delete(key); render();
    say(errMsg(e), null, 5000);
    return false;
  }
}
// Run an Action Button entry: apply its actions exactly as Grist would. UpdateRecord actions get an Undo.
async function runEntry(entry, key) {
  if (busy.has(key)) { say('Still saving. One moment.'); return; }
  const undo = [];
  for (const a of entry.actions) {
    const [kind, table, id, fields] = a, row = tables()[table]?.find(r => r.id === id);
    if (kind === 'UpdateRecord' && row && fields && typeof fields === 'object') {
      undo.push(['UpdateRecord', table, id, Object.fromEntries(Object.keys(fields).map(k => [k, row[k] ?? null]))]);
    } else { undo.length = 0; undo.push(null); break; }
  }
  const canUndo = undo.length && undo[0] !== null;
  busy.add(key); render();
  try {
    await write(entry.actions);
    busy.delete(key);
    say('Done.', canUndo ? async () => {
      try { await write(undo); await load(); say('Undone.'); } catch (e) { say(errMsg(e), null, 5000); }
    } : null);
    await load(); render();
  } catch (e) {
    busy.delete(key); render();
    say(errMsg(e), null, 5000);
  }
}

app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = Number(el.dataset.id), w = workshops.find(x => x.id === wsId);
  switch (el.dataset.act) {
    case 'retry': loadFailed = false; render(); load(); break;
    case 'open': openSheet(id); break;
    case 'add-open': openAdd(); break;
    case 'check': {
      if (!w) break;
      const col = el.dataset.col, now = !w[col];
      if (await save('Workshops', w.id, { [col]: now }, 'ws' + col)) say(now ? 'Ticked.' : 'Unticked.');
      break;
    }
    case 'here': {
      const r = regs.find(x => x.id === id); if (!r) break;
      const now = !r.Attended;
      if (await save('Registrations', id, { Attended: now }, 'reg' + id)) say(now ? 'Here.' : 'Not here.', () => save('Registrations', id, { Attended: !now }, 'reg' + id));
      break;
    }
    case 'run': {
      const key = el.dataset.key, i = Number(el.dataset.i);
      let entries = [];
      if (key === 'checkin') entries = buttonsOf(w?.Check_In_Button);
      else { const r = regs.find(x => x.id === Number(key.slice(3))); entries = buttonsOf(r?.Payment_Buttons); }
      if (entries[i]) runEntry(entries[i], key);
      break;
    }
  }
});
app.addEventListener('change', e => {
  if (e.target.matches('[data-pick]')) { wsId = Number(e.target.value); remember(wsId); render(); }
});

// ---- Sheets: guest details, and adding a guest ----------------------------------------
function openSheet(id) {
  const r = regs.find(x => x.id === id); if (!r) return;
  const c = contactOf(r);
  const phone = String(c?.Phone || '').trim(), email = String(c?.Email || '').trim();
  const digits = phone.replace(/[^\d+]/g, '');
  const init = { Notes: String(r.Notes ?? ''), Seats: String(Number(r.Seats) || 1), Status: String(r.Status ?? '') };
  const opts = statuses.includes(init.Status) || !init.Status ? statuses : [...statuses, init.Status];
  sheet = { kind: 'reg', id, init };
  sheetEl.innerHTML = `<form class="inner">
    <h1>${esc(nameOf(r)) || 'Guest'}</h1>
    ${digits || email ? `<div class="contact">
      ${digits ? `<a class="btn plain" href="tel:${esc(digits)}">Call</a><a class="btn plain" href="sms:${esc(digits)}">Text</a>` : ''}
      ${email ? `<a class="btn plain" href="mailto:${esc(encodeURIComponent(email))}">Email</a>` : ''}</div>` : '<p class="hint">No phone or email on file.</p>'}
    <label class="f"><span class="label">Seats</span><input id="f-Seats" type="number" min="1" step="1" inputmode="numeric" value="${esc(init.Seats)}"></label>
    <label class="f"><span class="label">Status</span><select id="f-Status">${opts.map(s => `<option${s === init.Status ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
    <label class="f"><span class="label">Notes</span><textarea id="f-Notes" rows="4">${esc(init.Notes)}</textarea></label>
    <div class="bar"><button type="submit" class="btn" data-sheet="save">Save</button><button type="button" class="btn plain" data-sheet="cancel">Cancel</button></div>
    <div class="bar" id="discard" hidden><button type="button" class="btn plain" data-sheet="keep">Keep editing</button><button type="button" class="btn" data-sheet="discard">Discard</button></div>
  </form>`;
  showSheet();
}
let add = null;   // { q, picked: contactId|null, isNew, first, last, email, phone, seats }
function openAdd() {
  add = { q: '', picked: null, isNew: false, first: '', last: '', email: '', phone: '', seats: '1' };
  sheet = { kind: 'add', init: {} };
  drawAdd(); showSheet();
}
function drawAdd() {
  const q = add.q.trim().toLowerCase();
  const found = q ? contacts.filter(c => String(c.Name || '').toLowerCase().includes(q)).slice(0, 8) : contacts.slice().sort((a, b) => String(a.Name).localeCompare(String(b.Name))).slice(0, 8);
  const inp = (n, label, type, extra = '') => `<label class="f"><span class="label">${label}</span><input data-add="${n}" type="${type}" value="${esc(add[n])}" autocomplete="off" ${extra}></label>`;
  sheetEl.innerHTML = `<form class="inner">
    <h1>Add a <em>guest</em></h1>
    ${add.isNew ? `${inp('first', 'First name', 'text')}${inp('last', 'Last name', 'text')}${inp('email', 'Email', 'email')}${inp('phone', 'Phone', 'tel')}
      <button type="button" class="link" data-add-act="existing">Pick an existing contact instead</button>`
    : `${inp('q', 'Find a contact', 'search', 'enterkeyhint="search"')}
      <div class="results">${found.map(c => `<button type="button" class="btn plain" data-add-act="pick" data-id="${c.id}" aria-pressed="${add.picked === c.id}">${esc(c.Name || '(no name)')}</button>`).join('') || '<p class="empty">No match.</p>'}</div>
      <button type="button" class="link" data-add-act="new">Not in the list? Add a new contact</button>`}
    ${inp('seats', 'Seats', 'number', 'min="1" step="1" inputmode="numeric"')}
    <div class="bar"><button type="submit" class="btn" id="add-save">Add as Pending</button><button type="button" class="btn plain" data-add-act="close">Cancel</button></div>
  </form>`;
}
function showSheet() { sheetEl.hidden = false; sheetEl.scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeSheet() { sheet = null; add = null; sheetEl.hidden = true; sheetEl.innerHTML = ''; document.body.style.overflow = ''; render(); }
const sheetVals = () => Object.fromEntries(Object.keys(sheet.init).map(k => [k, sheetEl.querySelector('#f-' + k)?.value ?? sheet.init[k]]));
const sheetDirty = () => { const v = sheetVals(); return Object.keys(v).some(k => v[k] !== sheet.init[k]); };

async function saveSheet() {
  const mineSheet = sheet, { id, init } = sheet, v = sheetVals(), fields = {};
  if (v.Notes !== init.Notes) fields.Notes = v.Notes;
  if (v.Seats !== init.Seats) {
    const n = Math.floor(Number(v.Seats));
    if (!(n >= 1)) { say('Seats needs a number, 1 or more.'); return; }
    fields.Seats = n;
  }
  if (v.Status !== init.Status) fields.Status = v.Status;
  if (!Object.keys(fields).length) { closeSheet(); return; }
  const btn = sheetEl.querySelector('[data-sheet=save]'); btn.disabled = true;
  const ok = await save('Registrations', id, fields, 'reg' + id);
  if (!ok) { if (sheet === mineSheet) btn.disabled = false; return; }
  if (sheet === mineSheet) closeSheet();
  say('Saved.');
}
async function saveAdd() {
  const w = workshops.find(x => x.id === wsId); if (!w) return;
  const seats = Math.floor(Number(add.seats));
  if (!(seats >= 1)) { say('Seats needs a number, 1 or more.'); return; }
  let contactId = add.picked, newContact = null;
  if (add.isNew) {
    if (!add.first.trim() && !add.last.trim()) { say('Add at least a first or last name.'); return; }
    newContact = { First_Name: add.first.trim(), Last_Name: add.last.trim(), Email: add.email.trim(), Phone: add.phone.trim() };
  } else if (!contactId) { say('Pick a contact first.'); return; }
  const btn = sheetEl.querySelector('#add-save'); btn.disabled = true;
  try {
    if (newContact) {
      const res = await write([['AddRecord', 'Contacts', null, newContact]]);
      contactId = Number(res?.retValues?.[0] ?? res?.[0]) || null;
      if (!contactId) {   // the API didn't hand back the new id: find the newest matching contact
        const fresh = rowsOf(await grist.docApi.fetchTable('Contacts'));
        contactId = fresh.filter(c => c.First_Name === newContact.First_Name && c.Last_Name === newContact.Last_Name).map(c => c.id).sort((a, b) => b - a)[0] || null;
      }
      if (!contactId) throw new Error('no contact id');
    }
    await write([['AddRecord', 'Registrations', null, { Contact: contactId, Workshop: w.id, Seats: seats, Status: 'Pending' }]]);
    closeSheet();
    say('Added as Pending.');
    await load();
  } catch (e) {
    if (btn.isConnected) btn.disabled = false;
    say(errMsg(e), null, 5000);
  }
}
sheetEl.addEventListener('input', e => { if (add && e.target.dataset.add) { add[e.target.dataset.add] = e.target.value; if (e.target.dataset.add === 'q') { drawAdd(); const i = sheetEl.querySelector('[data-add=q]'); i.focus(); i.setSelectionRange(add.q.length, add.q.length); } } });
sheetEl.addEventListener('submit', e => { e.preventDefault(); if (!sheet) return; if (sheet.kind === 'add') saveAdd(); else saveSheet(); });
sheetEl.addEventListener('click', e => {
  const a = e.target.closest('[data-add-act]')?.dataset;
  if (a && add) {
    if (a.addAct === 'pick') { add.picked = Number(e.target.closest('[data-add-act]').dataset.id); drawAdd(); }
    else if (a.addAct === 'new') { add.isNew = true; add.picked = null; drawAdd(); }
    else if (a.addAct === 'existing') { add.isNew = false; drawAdd(); }
    else if (a.addAct === 'close') closeSheet();
    return;
  }
  const act = e.target.closest('[data-sheet]')?.dataset.sheet;
  if (!act || !sheet) return;
  if (act === 'cancel') { if (sheetDirty()) sheetEl.querySelector('#discard').hidden = false; else closeSheet(); }
  else if (act === 'keep') sheetEl.querySelector('#discard').hidden = true;
  else if (act === 'discard') closeSheet();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !sheet) return;
  if (sheet.kind === 'add') closeSheet(); else sheetEl.querySelector('[data-sheet=cancel]').click();
});

// ---- Start ----------------------------------------------------------------------------
if (typeof grist === 'undefined') {
  loadFailed = true;
} else {
  grist.ready({ requiredAccess: 'full' });
  wsId = recall();
  grist.onRecords(() => load());
  setInterval(() => { if (!document.hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setTimeout(() => { if (!loaded) { loadFailed = true; render(); } }, LOAD_MS);
  load();
}
render();
</script>
</body>
</html>
