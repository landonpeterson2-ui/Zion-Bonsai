<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zion Bonsai what's coming (Grist widget)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<!-- A Grist custom widget: everything coming up, week by week, made for a phone.
     Put it on the Workshops table. No column mapping. Only works inside Grist. -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --paper: #F4EEE6; --paper-deep: #E9DFD2; --sandstone: #D9AE93; --linen: #FBF8F3;
    --clay: #A84A2B; --clay-dark: #8F3E23; --moss: #4F6420; --forest: #2F3B22;
    --rule: rgba(47, 59, 34, .15); --edge: rgba(47, 59, 34, .4);
    --late-bg: rgba(168, 74, 43, .13); --soon-bg: rgba(217, 174, 147, .4);
    --radius: 3px;
    --sans: 'Open Sans', system-ui, sans-serif;
    --label: 'Montserrat', 'Open Sans', system-ui, sans-serif;
    --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--forest); font: 400 16px/1.5 var(--sans); }
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 80px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  h1 { font: 500 34px/1.1 var(--display); margin: 4px 0 4px; }
  h1 em { font-style: italic; }
  h2 { font: 600 11px/1.2 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--moss);
       margin: 28px 0 10px; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; }
  .label { font: 600 11px/1.2 var(--label); letter-spacing: .16em; text-transform: uppercase; }
  .hint { color: var(--moss); font-size: 14px; margin: 4px 0; }
  .empty { color: var(--moss); padding: 6px 2px 10px; }
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  .btn { font: 600 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; min-height: 44px; padding: 0 18px;
         border: 1px solid var(--clay); border-radius: var(--radius); background: var(--clay); color: var(--linen); cursor: pointer; }
  .btn:hover { background: var(--clay-dark); border-color: var(--clay-dark); }
  .btn.plain { background: var(--linen); color: var(--forest); border-color: var(--edge); }
  .btn.plain:hover { background: var(--paper-deep); }
  .btn:disabled { opacity: .55; cursor: default; }
  .link { background: none; border: 0; padding: 0; min-height: 44px; display: inline-flex; align-items: center;
          color: var(--clay); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15px; }
  .people { display: grid; gap: 10px; margin-top: 14px; }
  .people .btn { min-height: 56px; font-size: 13px; text-align: left; padding: 0 20px; }
  .next { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; margin: 10px 0 4px; }
  .next b { font-weight: 600; }
  .card { background: var(--linen); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .card.late { background: var(--late-bg); border-color: rgba(168, 74, 43, .35); }
  .card.soon { background: var(--soon-bg); border-color: rgba(217, 174, 147, .9); }
  .card.done { opacity: .6; }
  .card.pending { opacity: .6; }
  .card .title { font-weight: 600; overflow-wrap: anywhere; cursor: pointer; min-height: 44px; display: flex; align-items: center;
                 background: none; border: 0; padding: 0; text-align: left; width: 100%; }
  .card .meta { color: var(--forest); font-size: 14px; margin: 0 0 10px; opacity: .85; }
  .card.late .meta { opacity: 1; font-weight: 600; }
  .card .donebtn { width: 100%; min-height: 48px; }
  .card .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  details.fold { margin-top: 18px; }
  details.fold summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--clay);
                         font: 600 11px/1.2 var(--label); letter-spacing: .16em; text-transform: uppercase; }
  .addbtn { width: 100%; min-height: 48px; margin-bottom: 10px; }
  form.add { display: grid; gap: 10px; margin-bottom: 12px; background: var(--linen); border: 1px solid var(--rule);
             border-radius: var(--radius); padding: 14px; }
  label.f { display: grid; gap: 4px; }
  label.f .label { color: var(--moss); }
  input, select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: var(--radius);
                            background: var(--paper); color: var(--forest); }
  textarea { min-height: 96px; resize: vertical; }
  input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .bar { display: flex; gap: 10px; }
  .bar .btn { flex: 1; }
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--paper); overflow-y: auto; }
  #sheet .inner { max-width: 640px; margin: 0 auto; padding: 18px 14px 40px; display: grid; gap: 14px; }
  #sheet h1 { font-size: 28px; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--forest); color: var(--linen); z-index: 20;
           padding: 8px 8px 8px 16px; border-radius: var(--radius); opacity: 0; transition: opacity .2s; pointer-events: none;
           display: flex; gap: 10px; align-items: center; max-width: calc(100% - 24px); }
  #toast.show { opacity: 1; pointer-events: auto; }
  #toast button { background: none; border: 1px solid rgba(251, 248, 243, .5); color: var(--linen); border-radius: var(--radius);
                  font: 600 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; min-height: 44px; padding: 0 14px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  .kind { color: var(--moss); display: block; margin-bottom: 2px; }
  .card.late .kind, .card.soon .kind { color: var(--forest); }
  .shows { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin: 8px 0 0; }
  .shows .label { color: var(--moss); }
  .shows label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; cursor: pointer; }
  .shows input { width: 20px; height: 20px; min-height: 0; padding: 0; accent-color: var(--moss); }
  dl.facts { margin: 0; display: grid; gap: 10px; }
  dl.facts div { border-top: 1px solid var(--rule); padding-top: 8px; }
  dl.facts dt { font: 600 11px/1.2 var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--moss); margin-bottom: 2px; }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="app"><p class="hint">This is a Grist custom widget. Open it inside Grist.</p></main>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Details"></div>
<div id="toast" role="status"></div>
<script>
// Reads Workshops, Tasks, Trees, Agreements and Contacts by name (full access) and shows
// them as one list, grouped by week. Which kinds to show is remembered on this phone.
const SHOW_KEY = 'zb-whats-coming-show';
const SAVE_MS = 10000, LOAD_MS = 20000;
const MSG_FAIL = "Couldn't load. Check your connection.";
const MSG_SAVE = "Couldn't save. Check your connection and try again.";
const MSG_ACCESS = "That can't be changed here. Ask Landon if you think it should be.";
const SOON_DAYS = 3, EARLIER_DAYS = 30;
const KINDS = [['workshop', 'Workshops'], ['task', 'Tasks'], ['tree', 'Shaping'], ['agreement', 'Agreements']];
const KIND_LABEL = { workshop: 'Workshop', task: 'Task', tree: 'Shaping', agreement: 'Agreement' };
const KIND_ORDER = { workshop: 0, task: 1, tree: 2, agreement: 3 };
const ENDED_AGREEMENT = ['Expired', 'Declined'];

let workshops = [], tasks = [], trees = [], agreements = [], contacts = [];
let hasNotes = false, hasDoneOn = false;
let show = { workshop: true, task: true, tree: true, agreement: true };
let loaded = false, loadFailed = false, loadSeq = 0, metaAt = 0;
let sheet = null;
const busy = new Set();

const app = document.getElementById('app');
const sheetEl = document.getElementById('sheet');
const toast = document.getElementById('toast');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function recallShow() { try { const v = JSON.parse(localStorage.getItem(SHOW_KEY) || 'null'); if (v && typeof v === 'object') for (const [k] of KINDS) if (v[k] === false) show[k] = false; } catch (e) {} }
function rememberShow() { try { localStorage.setItem(SHOW_KEY, JSON.stringify(show)); } catch (e) {} }

const withTimeout = (p, ms = SAVE_MS) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(new Error('timeout')), ms);
  Promise.resolve(p).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
});
const write = acts => withTimeout(grist.docApi.applyUserActions(acts));
function errMsg(e) {
  if (!navigator.onLine) return MSG_SAVE;
  return /access|permission|blocked|denied/i.test(String(e?.message ?? e)) ? MSG_ACCESS : MSG_SAVE;
}
function rowsOf(t) { return t.id.map((id, i) => Object.fromEntries(Object.keys(t).map(k => [k, t[k][i]]))); }

// ---- Dates: Grist Date cells are seconds at UTC midnight -------------------------------
function todayIso() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function isoDay(v) {
  if (v == null || v === '') return null;
  const secs = v instanceof Date ? v.getTime() / 1000 : Number(v);
  if (!Number.isFinite(secs) || secs <= 0) return null;
  if (secs % 86400 === 0) return new Date(secs * 1000).toISOString().slice(0, 10);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date(secs * 1000)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const toSecs = iso => iso ? Date.parse(iso + 'T00:00:00Z') / 1000 : null;
const dayDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const fmt = (iso, o) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const shortDay = iso => fmt(iso, { weekday: 'short', month: 'short', day: 'numeric' });
const longDay = iso => fmt(iso, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
function weekStart(iso) { const dow = new Date(iso + 'T00:00:00Z').getUTCDay(); return addDays(iso, -((dow + 6) % 7)); }   // Monday
function when(iso) {
  const today = todayIso();
  if (iso === today) return 'today';
  if (iso === addDays(today, 1)) return 'tomorrow';
  if (iso === addDays(today, -1)) return 'yesterday';
  return shortDay(iso);
}

// ---- Loading --------------------------------------------------------------------------
async function loadMeta() {
  if (Date.now() - metaAt < 60000) return;
  const [tb, col] = await Promise.all(['_grist_Tables', '_grist_Tables_column'].map(n => grist.docApi.fetchTable(n)));
  const ref = tb.id[tb.tableId.indexOf('Tasks')];
  const names = rowsOf(col).filter(c => c.parentId === ref).map(c => c.colId);
  hasNotes = names.includes('Notes'); hasDoneOn = names.includes('Done_On');
  metaAt = Date.now();
}
async function load() {
  const seq = ++loadSeq;
  try {
    const names = ['Workshops', 'Tasks', 'Trees', 'Agreements', 'Contacts'];
    const res = await Promise.allSettled(names.map(n => grist.docApi.fetchTable(n)));
    if (res[0].status === 'rejected' || res[1].status === 'rejected') throw new Error('load');
    const [w, t, tr, ag, co] = res.map(r => r.status === 'fulfilled' ? rowsOf(r.value) : []);
    await loadMeta();
    if (seq !== loadSeq) return;
    workshops = w; tasks = t; trees = tr; agreements = ag; contacts = co;
    loaded = true; loadFailed = false;
  } catch (e) {
    if (seq !== loadSeq) return;
    if (!loaded) { loadFailed = true; render(); }
    return;
  }
  requestRender();
}

// ---- Redraw guard: never while typing, with a sheet open, or just after a tap ----------
let lastDown = 0, pending = false;
document.addEventListener('pointerdown', () => { lastDown = Date.now(); }, true);
const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
const blocked = () => typing() || !!sheet || Date.now() - lastDown < 400;
function requestRender() { if (!pending) { pending = true; setTimeout(tryRender, 300); } }
function tryRender() { if (!pending) return; if (blocked()) { setTimeout(tryRender, 450); return; } render(); }
app.addEventListener('focusout', () => setTimeout(tryRender, 450));

function say(text, onUndo, ms) {
  toast.innerHTML = esc(text) + (onUndo ? ' <button type="button">Undo</button>' : '');
  if (onUndo) toast.querySelector('button').onclick = () => { toast.classList.remove('show'); onUndo(); };
  toast.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toast.classList.remove('show'), ms || (onUndo ? 6000 : 2600));
}

// ---- Items ----------------------------------------------------------------------------
const contactName = v => { const id = Number(v); return id ? String(contacts.find(c => c.id === id)?.Name || '') : String(v || ''); };
function seatsLine(w) {
  const taken = Number(w.Seats_Taken), cap = Number(w.Capacity), left = Number(w.Seats_Left);
  if (Number.isFinite(cap) && cap > 0 && Number.isFinite(taken)) return `${taken} of ${cap} seats taken`;
  if (Number.isFinite(left)) return `${left} seats left`;
  return '';
}
function buildItems() {
  const items = [];
  for (const w of workshops) {
    const date = isoDay(w.Date);
    if (!date || w.Status === 'Cancelled') continue;
    items.push({ kind: 'workshop', id: w.id, date, title: String(w.Title || 'Workshop'),
      meta: [shortDay(date), w.Time, Number.isFinite(Number(w.Seats_Left)) && w.Seats_Left !== null ? `${w.Seats_Left} left` : '', w.Status].filter(Boolean).join(' · ') });
  }
  for (const t of tasks) {
    const date = isoDay(t.Due);
    if (t.Done || !date) continue;
    items.push({ kind: 'task', id: t.id, date, title: String(t.Task || '(no name)'),
      meta: [`Due ${when(date)}`, t.Owner === 'Both' ? 'Both of you' : t.Owner].filter(Boolean).join(' · ') });
  }
  for (const r of trees) {
    const date = isoDay(r.Shaping_Due);
    if (!date) continue;
    const owner = contactName(r.Owner);
    items.push({ kind: 'tree', id: r.id, date, title: `Shaping due: ${r.Species || 'tree'}${owner ? ' — ' + owner : ''}`, meta: shortDay(date) });
  }
  for (const a of agreements) {
    const date = isoDay(a.End_Date);
    if (!date || ENDED_AGREEMENT.includes(a.Status)) continue;
    items.push({ kind: 'agreement', id: a.id, date, title: String(a.Title || 'Agreement'),
      meta: [`Ends ${shortDay(date)}`, a.Heads_Up].filter(Boolean).join(' · ') });
  }
  return items.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : KIND_ORDER[a.kind] - KIND_ORDER[b.kind] || a.title.localeCompare(b.title));
}
function groupName(date, today) {
  if (date === today) return 'Today';
  const n = dayDiff(weekStart(today), weekStart(date)) / 7;
  return n === 0 ? 'This week' : n === 1 ? 'Next week' : `Week of ${fmt(weekStart(date), { month: 'short', day: 'numeric' })}`;
}
function itemCard(it) {
  const today = todayIso(), isTask = it.kind === 'task';
  const late = isTask && it.date < today;
  const soon = isTask && !late && it.date <= addDays(today, SOON_DAYS);
  const p = busy.has(it.kind + it.id);
  return `<div class="card${late ? ' late' : soon ? ' soon' : ''}${p ? ' pending' : ''}">
    <span class="label kind">${esc(KIND_LABEL[it.kind])}</span>
    <button type="button" class="title" data-act="open" data-kind="${it.kind}" data-id="${it.id}">${esc(it.title)}</button>
    <p class="meta"${isTask ? '' : ' style="margin-bottom:0"'}>${esc(late ? 'Overdue, ' + it.meta.charAt(0).toLowerCase() + it.meta.slice(1) : it.meta)}${p ? ' · Saving…' : ''}</p>
    ${isTask ? `<button type="button" class="btn donebtn" data-act="done" data-id="${it.id}"${p ? ' disabled' : ''}>Done</button>` : ''}
  </div>`;
}
function render() {
  pending = false;
  if (!loaded) {
    app.innerHTML = loadFailed
      ? `<p>${esc(MSG_FAIL)}</p><button type="button" class="btn" data-act="retry">Try again</button>`
      : '<p class="hint">Loading…</p>';
    return;
  }
  const today = todayIso(), cutoff = addDays(today, -EARLIER_DAYS);
  // Open tasks that are overdue always show, however old; everything else drops off after 30 days.
  const items = buildItems().filter(i => show[i.kind] && (i.date >= cutoff || i.kind === 'task'));
  const earlier = items.filter(i => i.date < today).reverse();
  const groups = [];
  for (const it of items.filter(i => i.date >= today)) {
    const name = groupName(it.date, today);
    if (!groups.length || groups[groups.length - 1].name !== name) groups.push({ name, items: [] });
    groups[groups.length - 1].items.push(it);
  }
  app.innerHTML = `
    <h1>What's <em>coming</em></h1>
    <p class="hint">Everything coming up, week by week. Tap something to see more.</p>
    <div class="shows"><span class="label">Show:</span>${KINDS.map(([k, n]) =>
      `<label><input type="checkbox" data-show="${k}"${show[k] ? ' checked' : ''}> ${esc(n)}</label>`).join('')}</div>
    ${groups.map(g => `<h2><span>${esc(g.name)}</span><span>${g.items.length}</span></h2>${g.items.map(itemCard).join('')}`).join('')
      || '<p class="empty">Nothing coming up. Enjoy the quiet.</p>'}
    ${earlier.length ? `<details class="fold"><summary>Earlier (${earlier.length})</summary>${earlier.map(itemCard).join('')}</details>` : ''}`;
}

// ---- Saving ---------------------------------------------------------------------------
async function saveTask(id, fields) {
  const key = 'task' + id;
  if (busy.has(key)) { say('Still saving. One moment.'); return false; }
  busy.add(key); render();
  try {
    await write([['UpdateRecord', 'Tasks', id, fields]]);
    const row = tasks.find(r => r.id === id);
    if (row) Object.assign(row, fields);
    busy.delete(key); render();
    return true;
  } catch (e) {
    busy.delete(key); render();
    say(errMsg(e), null, 5000);
    return false;
  }
}
const doneFields = on => hasDoneOn ? { Done: on, Done_On: on ? toSecs(todayIso()) : null } : { Done: on };

app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = Number(el.dataset.id);
  switch (el.dataset.act) {
    case 'retry': loadFailed = false; render(); load(); break;
    case 'open': openSheet(el.dataset.kind, id); break;
    case 'done':
      if (await saveTask(id, doneFields(true))) say('Done.', () => saveTask(id, doneFields(false)));
      break;
  }
});
app.addEventListener('change', e => {
  const k = e.target.dataset?.show;
  if (k && k in show) { show[k] = e.target.checked; rememberShow(); render(); }
});

// ---- Details sheet --------------------------------------------------------------------
function facts(rows) {
  return `<dl class="facts">${rows.filter(r => r[1] !== '' && r[1] != null).map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>`;
}
const yesNo = v => v ? 'Done' : 'Not yet';
function openSheet(kind, id) {
  let body = '', init = {};
  if (kind === 'task') {
    const t = tasks.find(r => r.id === id); if (!t) return;
    init = { Task: String(t.Task ?? ''), Due: isoDay(t.Due) || '', Notes: String(t.Notes ?? '') };
    body = `<h1>Task</h1>
      <label class="f"><span class="label">Task</span><input id="f-Task" value="${esc(init.Task)}" autocomplete="off"></label>
      <label class="f"><span class="label">Due date</span><input id="f-Due" type="date" value="${esc(init.Due)}"></label>
      ${hasNotes ? `<label class="f"><span class="label">Notes</span><textarea id="f-Notes" rows="4">${esc(init.Notes)}</textarea></label>` : ''}
      <div class="bar"><button type="submit" class="btn" data-sheet="save">Save</button><button type="button" class="btn plain" data-sheet="cancel">Cancel</button></div>`;
  } else if (kind === 'workshop') {
    const w = workshops.find(r => r.id === id); if (!w) return;
    const d = isoDay(w.Date);
    body = `<h1>${esc(w.Title || 'Workshop')}</h1>
      ${facts([['Date', d ? longDay(d) : ''], ['Time', w.Time], ['Seats', seatsLine(w)], ['Status', w.Status],
        ['Group photo', yesNo(w.Group_Photo)], ['Care sent', yesNo(w.Care_Sent)], ['Survey sent', yesNo(w.Survey_Sent)]])}
      <p class="hint">To run the day, open Workshop day.</p>
      <button type="button" class="btn plain" data-sheet="cancel">Close</button>`;
  } else if (kind === 'tree') {
    const r = trees.find(x => x.id === id); if (!r) return;
    const d = isoDay(r.Shaping_Due);
    body = `<h1>${esc(r.Species || 'Tree')}</h1>
      ${facts([['Shaping due', d ? longDay(d) : ''], ['Owner', contactName(r.Owner)], ['Potted at', wsTitleOf(r.Workshop)], ['Status', r.Return_Status]])}
      <button type="button" class="btn plain" data-sheet="cancel">Close</button>`;
  } else {
    const a = agreements.find(x => x.id === id); if (!a) return;
    const d = isoDay(a.End_Date);
    body = `<h1>${esc(a.Title || 'Agreement')}</h1>
      ${facts([['Ends', d ? longDay(d) : ''], ['Status', a.Status], ['Heads up', a.Heads_Up]])}
      <button type="button" class="btn plain" data-sheet="cancel">Close</button>`;
  }
  sheet = { kind, id, init };
  sheetEl.innerHTML = `<form class="inner">${body}
    <div class="bar" id="discard" hidden><button type="button" class="btn plain" data-sheet="keep">Keep editing</button><button type="button" class="btn" data-sheet="discard">Discard</button></div></form>`;
  sheetEl.hidden = false; sheetEl.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
const wsTitleOf = v => String(workshops.find(w => w.id === Number(v))?.Title || '');
function closeSheet() { sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = ''; document.body.style.overflow = ''; render(); }
const sheetVals = () => Object.fromEntries(Object.keys(sheet.init).map(k => [k, sheetEl.querySelector('#f-' + k)?.value ?? sheet.init[k]]));
const sheetDirty = () => { const v = sheetVals(); return Object.keys(v).some(k => v[k] !== sheet.init[k]); };
async function saveSheet() {
  if (sheet.kind !== 'task') return;
  const mineSheet = sheet, { id, init } = sheet, v = sheetVals(), fields = {};
  if (v.Task !== init.Task) {
    if (!v.Task.trim()) { say('Give it a name first.'); return; }
    fields.Task = v.Task.trim();
  }
  if (v.Due !== init.Due) fields.Due = toSecs(v.Due);
  if (hasNotes && v.Notes !== init.Notes) fields.Notes = v.Notes;
  if (!Object.keys(fields).length) { closeSheet(); return; }
  const btn = sheetEl.querySelector('[data-sheet=save]'); btn.disabled = true;
  const ok = await saveTask(id, fields);
  if (!ok) { if (sheet === mineSheet) btn.disabled = false; return; }
  if (sheet === mineSheet) closeSheet();
  say('Saved.');
}
sheetEl.addEventListener('submit', e => { e.preventDefault(); if (sheet) saveSheet(); });
sheetEl.addEventListener('click', e => {
  const act = e.target.closest('[data-sheet]')?.dataset.sheet;
  if (!act || !sheet) return;
  if (act === 'cancel') { if (Object.keys(sheet.init).length && sheetDirty()) sheetEl.querySelector('#discard').hidden = false; else closeSheet(); }
  else if (act === 'keep') sheetEl.querySelector('#discard').hidden = true;
  else if (act === 'discard') closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) sheetEl.querySelector('[data-sheet=cancel]').click(); });

// ---- Start ----------------------------------------------------------------------------
recallShow();
if (typeof grist === 'undefined') {
  loadFailed = true;
} else {
  grist.ready({ requiredAccess: 'full' });
  grist.onRecords(() => load());
  setInterval(() => { if (!document.hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setTimeout(() => { if (!loaded) { loadFailed = true; render(); } }, LOAD_MS);
  load();
}
render();
</script>
</body>
</html>
